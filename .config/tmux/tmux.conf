# Set default terminal and enable truecolor/RGB support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Minimize escape-time for responsive key handling
set -sg escape-time 0

# Pass focus events to applications
set -g focus-events on

# Increase scrollback history
set -g history-limit 50000

# Mouse support
set -g mouse on

# Clipboard integration via OSC 52
set -s set-clipboard external

# Primary prefix: Ctrl+Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Fallback prefix: Ctrl+a
set -g prefix2 C-a
bind C-a send-prefix -2

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split windows vertically using current path
unbind %
bind v split-window -h -c "#{pane_current_path}"

# Split windows horizontally(stack) using current path
unbind '"'
bind s split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "source-file ~/.config/tmux/tmux.conf"

# Toggle status bar
bind b set -g status

# Indexing and window management
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl for pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+Shift+hjkl for resizing
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Alt+number for window selection
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
